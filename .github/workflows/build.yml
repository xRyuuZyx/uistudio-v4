name: Build UIStudio

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build jar
        run: mvn -B package
      - uses: actions/upload-artifact@v4
        with:
          name: UIStudio
          path: target/UIStudio.jar
